# Dependabot — actualizaciones automáticas de dependencias
version: 2
updates:
  # Dependencias Python (pyproject.toml)
  - package-ecosystem: pip

    # Espera 7 dias antes de proponer una version nueva (mitiga paquetes comprometidos recien publicados)

    cooldown:

      default-days: 7
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - python
    groups:
      fastapi-stack:
        patterns:
          - "fastapi*"
          - "uvicorn*"
          - "pydantic*"
          - "httpx*"
          - "tenacity*"
      database:
        patterns:
          - "sqlalchemy*"
          - "oracledb*"
          - "alembic*"
      messaging:
        patterns:
          - "aio-pika*"
          - "py-eureka-client*"
      testing:
        patterns:
          - "pytest*"
          - "pytest-asyncio*"

  # Imagen base de contenedor (Dockerfile)
  - package-ecosystem: docker

    # Espera 7 dias antes de proponer una version nueva (mitiga paquetes comprometidos recien publicados)

    cooldown:

      default-days: 7
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker

  # Flujos de trabajo de GitHub Actions
  - package-ecosystem: github-actions

    # Espera 7 dias antes de proponer una version nueva (mitiga paquetes comprometidos recien publicados)

    cooldown:

      default-days: 7
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
