services:
  oracle-espacios:
    image: gvenzl/oracle-free:23.5-slim
    container_name: oracle-espacios
    restart: unless-stopped
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${DB_PASSWORD}
      APP_USER: ${DB_USERNAME:-admin}
      APP_USER_PASSWORD: ${DB_PASSWORD}
      ORACLE_PDB: freepdb1
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - convivo-network

  ms-espacios-comunes:
    build: .
    container_name: ms-espacios-comunes
    restart: unless-stopped
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/api/v1/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - convivo-network
    environment:
      DB_HOST: oracle-espacios
      DB_PORT: 1521
      DB_NAME: freepdb1
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USUARIO: ${RABBITMQ_USUARIO}
      RABBITMQ_CONTRASENA: ${RABBITMQ_CONTRASENA}
      EUREKA_URL: ${EUREKA_URL}
      EUREKA_IP: ms-espacios-comunes
      EUREKA_PORT: 8082
      PUERTO: 8082
      MODO_DEBUG: "false"
      CONFIG_SERVER_URL: http://config-server:8888
    depends_on:
      oracle-espacios:
        condition: service_healthy

  scanner:
    image: sonarsource/sonar-scanner-cli:latest
    container_name: convivo-espacios-scanner
    profiles:
      - tools
    env_file:
      - path: .env
        required: false
    environment:
      - SONAR_HOST_URL=http://sonarqube:9000
      - SONAR_TOKEN=${SONAR_TOKEN:-}
    volumes:
      - ./:/usr/src
    networks:
      - convivo-network
volumes:
  oracle_data:

networks:
  convivo-network:
    external: true
    name: convivo-network

